name: Web CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yaml"
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "uv.lock"
      - "pyproject.toml"

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, build, and browser tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pix_share_e2e
      UPLOADS_DIR: /tmp/pixshare-e2e-uploads
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
      API_READ_LIMIT: "10000"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pix_share_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pix_share_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Prepare real test API and database
        working-directory: .
        run: |
          uv sync --locked --no-dev
          uv run --no-sync alembic upgrade head
          uv run --no-sync python -m scripts.seed_db
          uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/pixshare-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/ready; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Permit the installed Chromium user namespace sandbox
        # Ubuntu restricts user namespaces for binaries without an AppArmor
        # profile. Permit only this installed browser, keeping its sandbox on.
        # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        run: |
          browser_path="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo tee /etc/apparmor.d/pixshare-ci-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile pixshare-ci-chromium "$browser_path" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/pixshare-ci-chromium
          fi

      - name: Public browser journeys against PostgreSQL
        run: pnpm test:e2e --project=desktop --project=tablet --project=mobile
