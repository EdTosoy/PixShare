name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:

env:
  CLERK_PUBLISHABLE_KEY: test
  CLERK_SECRET_KEY: test
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pix_share_test
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pix_share_test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pix_share_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pix_share_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest
